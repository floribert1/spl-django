{% extends "paiements/base.html" %}
{% block titre %}Connexion{% endblock %}
{% block contenu %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-10 col-md-6 col-lg-4">
    <div class="card carte p-4">
      <h1 class="h4 mb-1 text-center">Connexion</h1>
      <p class="text-muted text-center small mb-4">Client ou administrateur</p>
      {% if form.errors %}
        <div class="alert alert-danger small">Identifiant ou mot de passe incorrect.</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="id_username">Identifiant</label>
          <input class="form-control" type="text" name="username" id="id_username" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="id_password">Mot de passe</label>
          <input class="form-control" type="password" name="password" id="id_password" required>
        </div>
        <button class="btn btn-primary w-100">Se connecter</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
